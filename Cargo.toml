[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ingest",
    "crates/query",
    "crates/api",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Matt-mdlivingston/diamond-stats"
authors = ["Matt Livingston"]
rust-version = "1.88"

[workspace.dependencies]
diamond-stats-core = { path = "crates/core" }
diamond-stats-ingest = { path = "crates/ingest" }
diamond-stats-query = { path = "crates/query" }
diamond-stats-api = { path = "crates/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "rustls"] }
arrow = "60"
parquet = "60"
duckdb = "1.20000"
axum = "0.8"
utoipa = { version = "6", features = ["macros"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
tower-http = { version = "0.7", features = ["trace"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
tempfile = "3"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
