name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test, deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Check the feature graph we actually build. `--all-features` pulls
          # optional DuckDB extensions this workspace does not enable.
          arguments: "--workspace"
